apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
          - mountPath: /tmp
            name: sample-secret
      initContainers:
      - name: init-myservice
        image: busybox:1.28
        command:
        - sh 
        - -c 
        - |
          aws secretsmanager get-secret-value --secret-id roboshop/mysql/password --query SecretString --output text | jq -r .MYSQL_ROOT_PASSWORD > /tmp/mysql_root_password.txt
        volumeMounts:
          - mountPath: /tmp
            name: sample-secret
    serviceAccount: roboshop-mysql-secret-reader
    volumes:
      - name: sample-secret
        emptyDir: {}